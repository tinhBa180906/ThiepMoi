<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – Danh Sách Xác Nhận Tham Dự</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --teal-50: #f0fdfa; --teal-100: #ccfbf1; --teal-200: #99f6e4;
      --teal-400: #2dd4bf; --teal-500: #14b8a6; --teal-600: #0d9488;
      --teal-700: #0f766e; --teal-800: #115e59;
      --gold: #fde68a; --white: #ffffff;
    }
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background: linear-gradient(135deg, #e0f7fa 0%, #b2dfdb 50%, #e0f2f1 100%);
      min-height: 100vh; padding: 32px 16px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    .header {
      background: linear-gradient(135deg, var(--teal-700), var(--teal-500));
      border-radius: 20px; padding: 32px 36px; margin-bottom: 24px;
      color: var(--white); box-shadow: 0 12px 40px rgba(13,148,136,0.3);
    }
    .header h1 { font-family: 'Playfair Display', serif; font-size: 28px; margin-bottom: 6px; }
    .header p  { font-size: 14px; opacity: 0.7; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-card {
      background: var(--white); border-radius: 16px; padding: 20px 24px;
      text-align: center; box-shadow: 0 4px 20px rgba(13,148,136,0.1);
      border: 1px solid var(--teal-100);
    }
    .stat-num { font-size: 36px; font-weight: 700; color: var(--teal-600); margin-bottom: 4px; }
    .stat-label { font-size: 13px; color: #64748b; }
    .table-card {
      background: var(--white); border-radius: 20px; overflow: hidden;
      box-shadow: 0 4px 20px rgba(13,148,136,0.1); border: 1px solid var(--teal-100);
    }
    .table-header {
      background: var(--teal-50); padding: 20px 28px;
      border-bottom: 1px solid var(--teal-100);
      display: flex; align-items: center; justify-content: space-between;
    }
    .table-header h2 { font-size: 16px; color: var(--teal-800); font-weight: 600; }
    .btn-refresh {
      background: var(--teal-600); color: var(--white); border: none;
      padding: 8px 18px; border-radius: 10px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    .btn-refresh:hover { background: var(--teal-700); }
    table { width: 100%; border-collapse: collapse; }
    th {
      background: var(--teal-700); color: var(--white); font-size: 12px;
      text-transform: uppercase; letter-spacing: 0.08em; padding: 14px 20px;
      text-align: left;
    }
    td { padding: 14px 20px; font-size: 14px; color: #334155; border-bottom: 1px solid #f1f5f9; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--teal-50); }
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
    }
    .badge.yes { background: #dcfce7; color: #15803d; }
    .badge.no  { background: #fee2e2; color: #b91c1c; }
    .wish-cell { max-width: 220px; font-size: 13px; color: #64748b; line-height: 1.5; }
    .empty-state { text-align: center; padding: 60px; color: #94a3b8; }
    .empty-state p { margin-top: 12px; font-size: 15px; }
    .date-cell { font-size: 12px; color: #94a3b8; }
    @media (max-width: 600px) {
      .stats { grid-template-columns: 1fr; }
      th:nth-child(4), td:nth-child(4) { display: none; }
      .header { padding: 24px; }
      .header h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎓 Quản Lý Xác Nhận Tham Dự</h1>
      <p>Lễ Tốt Nghiệp – Nguyễn Văn Hồ · Kỹ Thuật Phần Mềm · 22/08/2026</p>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-num" id="totalCount">–</div>
        <div class="stat-label">Tổng phản hồi</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="yesCount" style="color:#15803d">–</div>
        <div class="stat-label">✅ Tham dự</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="noCount" style="color:#b91c1c">–</div>
        <div class="stat-label">❌ Không tham dự</div>
      </div>
    </div>

    <div class="table-card">
      <div class="table-header">
        <h2>📋 Danh Sách Khách Mời</h2>
        <button class="btn-refresh" onclick="loadData()">🔄 Làm mới</button>
      </div>
      <div id="tableContainer">
        <div class="empty-state">
          <div style="font-size:48px">⏳</div>
          <p>Đang tải dữ liệu...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const CLOUD_DB_URL = 'https://api.restful-api.dev/objects/ff8081819f7e10ae019febf646211dd0';

    async function loadData() {
      let rsvpsData = [];
      let total = 0, attending = 0, notAttending = 0;

      // 1. Try Global Cloud Database (syncs RSVPs from ALL phones & devices)
      try {
        const cloudRes = await fetch(CLOUD_DB_URL);
        if (cloudRes.ok) {
          const json = await cloudRes.json();
          const list = json?.data?.records || [];
          rsvpsData = [...list].reverse();
        }
      } catch (err) {
        console.warn('Cloud fetch error, trying local server/localStorage fallback...', err);
      }

      // 2. Fallback to local server or localStorage if Cloud DB returned no items or failed
      if (rsvpsData.length === 0) {
        try {
          const [rsvpsRes, countRes] = await Promise.all([
            fetch('/api/rsvps'),
            fetch('/api/rsvp-count'),
          ]);
          const rsvps = await rsvpsRes.json();
          rsvpsData = rsvps.data || [];
        } catch (_) {
          const local = JSON.parse(localStorage.getItem('rsvp_records') || '[]');
          rsvpsData = local.reverse();
        }
      }

      // Calculate stats
      total = rsvpsData.length;
      attending = rsvpsData.filter(r => r.attending === 'yes').length;
      notAttending = rsvpsData.filter(r => r.attending === 'no').length;

      // Stats
      document.getElementById('totalCount').textContent = total;
      document.getElementById('yesCount').textContent   = attending;
      document.getElementById('noCount').textContent    = notAttending;

      // Table
      const container = document.getElementById('tableContainer');
      if (!rsvpsData || rsvpsData.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div style="font-size:48px">📭</div>
            <p>Chưa có xác nhận nào trên thiết bị này. Hãy chia sẻ link thiệp mời!</p>
          </div>`;
        return;
      }

      const rows = rsvpsData.map((r, i) => {
        const dt = new Date(r.submitted_at).toLocaleString('vi-VN');
        const badge = r.attending === 'yes'
          ? '<span class="badge yes">✅ Tham dự</span>'
          : '<span class="badge no">❌ Không tham dự</span>';
        const wish = r.wish_message
          ? `<div class="wish-cell">${escHtml(r.wish_message)}</div>`
          : `<span style="color:#cbd5e1;font-style:italic">–</span>`;
        return `<tr>
          <td style="color:#94a3b8;font-size:12px">${i + 1}</td>
          <td><strong>${escHtml(r.guest_name)}</strong></td>
          <td>${badge}</td>
          <td>${wish}</td>
          <td class="date-cell">${dt}</td>
        </tr>`;
      }).join('');

      container.innerHTML = `
        <table>
          <thead><tr>
            <th>#</th><th>Tên Khách</th><th>Xác Nhận</th>
            <th>Lời Chúc</th><th>Thời Gian</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    loadData();
    setInterval(loadData, 30000); // auto-refresh every 30s
  </script>
</body>
</html>
